name: Deploy webflasher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webflasher-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and package webflasher
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - rpi4
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Test and build website
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run test:python

      - name: Validate deployment output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/release.json
          test -s dist/firmware-catalog.json
          test -d dist/assets
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const release = JSON.parse(fs.readFileSync("dist/release.json", "utf8"));
            if (release.schemaVersion !== 1 || release.buildSha !== process.env.GITHUB_SHA) {
              throw new Error("Release manifest " + JSON.stringify(release) + " does not match " + process.env.GITHUB_SHA);
            }
            const catalogPath = "dist/firmware-catalog.json";
            const catalogBytes = fs.readFileSync(catalogPath);
            const catalogSha256 = crypto.createHash("sha256").update(catalogBytes).digest("hex");
            if (release.firmwareCatalogSha256 !== catalogSha256) {
              throw new Error("Release firmware catalog digest does not match " + catalogPath);
            }
            const archiveCatalogPath = "dist/firmware-updates/source-files/index.json";
            if (!catalogBytes.equals(fs.readFileSync(archiveCatalogPath))) {
              throw new Error("Release-bound and archive firmware catalogs differ");
            }
            const catalog = JSON.parse(catalogBytes);
            const customReleases = catalog.releases.filter((entry) => entry.channel === "custom");
            if (customReleases.length !== 0) {
              throw new Error("Catalog still contains a retired custom firmware release");
            }
            const newestOfficial = catalog.releases
              .filter((entry) => entry.channel === "official" && entry.trust === "official-pinned")
              .sort((left, right) => right.internalVersion.localeCompare(left.internalVersion, undefined, { numeric: true }))[0];
            if (!newestOfficial?.url || !/^[0-9a-f]{64}$/.test(newestOfficial.sha256 ?? "")) {
              throw new Error("Catalog has no hash-pinned official release");
            }
            const targetPath = "dist" + newestOfficial.url;
            const targetBytes = fs.readFileSync(targetPath);
            const targetSha256 = crypto.createHash("sha256").update(targetBytes).digest("hex");
            if (targetBytes.length !== newestOfficial.size || targetSha256 !== newestOfficial.sha256) {
              throw new Error("Newest official release does not match its catalog pin");
            }
            const newestRing = [...(catalog.ringReleases ?? [])]
              .sort((left, right) => right.version.localeCompare(left.version, undefined, { numeric: true }))[0];
            if (!newestRing?.url || !/^[0-9a-f]{64}$/.test(newestRing.sha256 ?? "")) {
              throw new Error("Catalog has no hash-pinned R1 release");
            }
            const ringPath = "dist" + newestRing.url;
            const ringBytes = fs.readFileSync(ringPath);
            const ringSha256 = crypto.createHash("sha256").update(ringBytes).digest("hex");
            if (ringBytes.length !== newestRing.size || ringSha256 !== newestRing.sha256) {
              throw new Error("Newest R1 release does not match its catalog pin");
            }
          '
          if find dist -type l -print -quit | grep -q .; then
            echo "The deployable site must not contain symbolic links." >&2
            exit 1
          fi

      - name: Build deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/webflasher-artifact"
          mkdir -p "${artifact_dir}"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "${artifact_dir}/webflasher-site.tar.gz" \
            .
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C deploy/homeassistant-addon \
            -czf "${artifact_dir}/webflasher-remote-support-addon.tar.gz" \
            Dockerfile \
            config.yaml \
            DOCS.md \
            package.json \
            package-lock.json \
            server.mjs \
            rootfs
          cp deploy/webflasher.caddy "${artifact_dir}/webflasher.caddy"
          cp scripts/verify-webflasher-caddy.sh "${artifact_dir}/verify-webflasher-caddy.sh"
          cp scripts/reconcile-webflasher-caddy.sh "${artifact_dir}/reconcile-webflasher-caddy.sh"
          cp scripts/activate-homeassistant-app.sh "${artifact_dir}/activate-homeassistant-app.sh"
          chmod 755 "${artifact_dir}/verify-webflasher-caddy.sh"
          chmod 755 "${artifact_dir}/reconcile-webflasher-caddy.sh"
          chmod 755 "${artifact_dir}/activate-homeassistant-app.sh"
          (
            cd "${artifact_dir}"
            sha256sum \
              webflasher-site.tar.gz \
              webflasher-remote-support-addon.tar.gz \
              webflasher.caddy \
              activate-homeassistant-app.sh \
              reconcile-webflasher-caddy.sh \
              verify-webflasher-caddy.sh \
              > webflasher-release.sha256
          )

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: webflasher-site-${{ github.sha }}
          path: |
            ${{ runner.temp }}/webflasher-artifact/webflasher-site.tar.gz
            ${{ runner.temp }}/webflasher-artifact/webflasher-remote-support-addon.tar.gz
            ${{ runner.temp }}/webflasher-artifact/webflasher.caddy
            ${{ runner.temp }}/webflasher-artifact/activate-homeassistant-app.sh
            ${{ runner.temp }}/webflasher-artifact/reconcile-webflasher-caddy.sh
            ${{ runner.temp }}/webflasher-artifact/verify-webflasher-caddy.sh
            ${{ runner.temp }}/webflasher-artifact/webflasher-release.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to production
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - rpi4
    timeout-minutes: 15
    environment:
      name: production
      url: https://webflasher.sybilsight.com/

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: webflasher-site-${{ github.sha }}
          path: ${{ runner.temp }}/webflasher-release

      - name: Set up Node.js for production verification
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/webflasher-release"
          sha256sum --check webflasher-release.sha256

      - name: Deploy requester-side Remote Support relay
        env:
          SSH_TARGET: homeassistant
          REMOTE_SUPPORT_APP: local_sybilsight_remote_support
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/webflasher-release/webflasher-remote-support-addon.tar.gz"
          activate_script="${RUNNER_TEMP}/webflasher-release/activate-homeassistant-app.sh"
          remote_stage="/addons/.sybilsight-remote-support-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_target="/addons/sybilsight-remote-support"
          remote_backup="/addons/.sybilsight-remote-support-previous"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          cleanup() {
            ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- "${remote_stage}" <<'CLEANUP_SCRIPT' || true
          set -eu
          stage="$1"
          case "${stage}" in
            /addons/.sybilsight-remote-support-deploy-*) ;;
            *) exit 1 ;;
          esac
          if [ -e "${stage}" ]; then
            rm -rf -- "${stage}"
          fi
          CLEANUP_SCRIPT
          }
          trap cleanup EXIT

          ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- "${remote_stage}" <<'STAGE_SCRIPT'
          set -eu
          stage="$1"
          case "${stage}" in
            /addons/.sybilsight-remote-support-deploy-*) ;;
            *) exit 1 ;;
          esac
          if [ -e "${stage}" ]; then
            rm -rf -- "${stage}"
          fi
          mkdir "${stage}"
          STAGE_SCRIPT

          gzip -dc "${archive}" |
            ssh "${ssh_options[@]}" "${SSH_TARGET}" tar -xpf - -C "${remote_stage}"

          ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
            "${remote_stage}" "${remote_target}" "${remote_backup}" <<'PUBLISH_RELAY_SCRIPT'
          set -eu
          stage="$1"
          target="$2"
          backup="$3"
          case "${stage}" in
            /addons/.sybilsight-remote-support-deploy-*) ;;
            *) exit 1 ;;
          esac
          [ "${target}" = /addons/sybilsight-remote-support ]
          [ "${backup}" = /addons/.sybilsight-remote-support-previous ]
          for required in Dockerfile config.yaml DOCS.md package.json package-lock.json server.mjs; do
            [ -s "${stage}/${required}" ]
            [ ! -L "${stage}/${required}" ]
          done
          [ -s "${stage}/rootfs/etc/services.d/remote-support/run" ]
          [ ! -L "${stage}/rootfs/etc/services.d/remote-support/run" ]
          if find "${stage}" -type l -print -quit | grep -q .; then
            echo "The Remote Support app must not contain symbolic links." >&2
            exit 1
          fi
          if [ -e "${backup}" ]; then
            rm -rf -- "${backup}"
          fi
          moved_previous=false
          if [ -e "${target}" ]; then
            mv "${target}" "${backup}"
            moved_previous=true
          fi
          if ! mv "${stage}" "${target}"; then
            if [ "${moved_previous}" = true ]; then
              mv "${backup}" "${target}"
            fi
            exit 1
          fi
          PUBLISH_RELAY_SCRIPT

          if ! ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
            "${REMOTE_SUPPORT_APP}" "${remote_target}" < "${activate_script}"; then
            ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
              "${remote_target}" "${remote_backup}" <<'ROLLBACK_RELAY_SCRIPT'
          set -eu
          target="$1"
          backup="$2"
          [ "${target}" = /addons/sybilsight-remote-support ]
          [ "${backup}" = /addons/.sybilsight-remote-support-previous ]
          failed="/addons/.sybilsight-remote-support-failed"
          rm -rf -- "${failed}"
          mv "${target}" "${failed}"
          mv "${backup}" "${target}"
          ROLLBACK_RELAY_SCRIPT
            ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
              "${REMOTE_SUPPORT_APP}" "${remote_target}" < "${activate_script}" || true
            exit 1
          fi

          trap - EXIT
          echo "Deployed Remote Support protocol 3 to ${SSH_TARGET}:${remote_target}"

      - name: Reconcile production Caddy routing
        env:
          SSH_TARGET: homeassistant
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/webflasher-release"
          active_caddyfile="${RUNNER_TEMP}/active-Caddyfile"
          candidate_caddyfile="${RUNNER_TEMP}/candidate-Caddyfile"
          remote_caddyfile="/addon_configs/c80c7555_caddy-2/Caddyfile"
          remote_incoming="/addon_configs/c80c7555_caddy-2/.Caddyfile.webflasher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_backup="/addon_configs/c80c7555_caddy-2/.Caddyfile.webflasher-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          scp "${ssh_options[@]}" "${SSH_TARGET}:${remote_caddyfile}" "${active_caddyfile}"
          sh "${release_dir}/reconcile-webflasher-caddy.sh" \
            "${active_caddyfile}" \
            "${release_dir}/webflasher.caddy" \
            "${candidate_caddyfile}"

          caddy_changed=false
          if ! cmp -s "${active_caddyfile}" "${candidate_caddyfile}"; then
            caddy_changed=true
            scp "${ssh_options[@]}" "${candidate_caddyfile}" "${SSH_TARGET}:${remote_incoming}"
            ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
              "${remote_incoming}" "${remote_caddyfile}" "${remote_backup}" <<'INSTALL_CADDY_SCRIPT'
          set -eu
          incoming="$1"
          active="$2"
          backup="$3"
          case "${incoming}" in
            /addon_configs/c80c7555_caddy-2/.Caddyfile.webflasher-*) ;;
            *) exit 1 ;;
          esac
          case "${backup}" in
            /addon_configs/c80c7555_caddy-2/.Caddyfile.webflasher-backup-*) ;;
            *) exit 1 ;;
          esac
          [ "${active}" = /addon_configs/c80c7555_caddy-2/Caddyfile ]
          [ -f "${active}" ] && [ ! -L "${active}" ]
          [ -f "${incoming}" ] && [ ! -L "${incoming}" ]
          [ ! -e "${backup}" ] && [ ! -L "${backup}" ]
          owner_group="$(stat -c '%u:%g' "${active}")"
          mode="$(stat -c '%a' "${active}")"
          chown "${owner_group}" "${incoming}"
          chmod "${mode}" "${incoming}"
          cp -p "${active}" "${backup}"
          mv "${incoming}" "${active}"
          if ! ha apps restart c80c7555_caddy-2 --no-progress; then
            failed="${active}.failed-${incoming##*.Caddyfile.webflasher-}"
            mv "${active}" "${failed}"
            mv "${backup}" "${active}"
            ha apps restart c80c7555_caddy-2 --no-progress || true
            exit 1
          fi
          INSTALL_CADDY_SCRIPT
          fi

          caddy_healthy=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              "https://webflasher.sybilsight.com/release.json?caddy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              >/dev/null && \
              curl --fail --silent --show-error --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "https://webflasher.sybilsight.com/remote-support/healthz" \
                >/dev/null; then
              caddy_healthy=true
              break
            fi
            sleep 5
          done
          if [ "${caddy_healthy}" != true ]; then
            if [ "${caddy_changed}" = true ]; then
              ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
                "${remote_caddyfile}" "${remote_backup}" <<'ROLLBACK_CADDY_SCRIPT'
          set -eu
          active="$1"
          backup="$2"
          [ "${active}" = /addon_configs/c80c7555_caddy-2/Caddyfile ]
          case "${backup}" in
            /addon_configs/c80c7555_caddy-2/.Caddyfile.webflasher-backup-*) ;;
            *) exit 1 ;;
          esac
          [ -f "${backup}" ] && [ ! -L "${backup}" ]
          failed="${active}.failed-${backup##*.Caddyfile.webflasher-backup-}"
          mv "${active}" "${failed}"
          mv "${backup}" "${active}"
          ha apps restart c80c7555_caddy-2 --no-progress || true
          ROLLBACK_CADDY_SCRIPT
            fi
            echo "Production Caddy did not become healthy after routing reconciliation." >&2
            exit 1
          fi

          scp "${ssh_options[@]}" "${SSH_TARGET}:${remote_caddyfile}" "${RUNNER_TEMP}/verified-Caddyfile"
          sh "${release_dir}/verify-webflasher-caddy.sh" \
            "${RUNNER_TEMP}/verified-Caddyfile" \
            "${release_dir}/webflasher.caddy"
          echo "Production Caddy routing is reconciled and healthy."

      - name: Deploy website
        env:
          SSH_TARGET: homeassistant
          DEPLOY_ROOT: /root/share
          WEB_ROOT: /root/share/webflasher/
          FIRMWARE_ROOT: /root/share/sybilsight/firmware-updates/source-files
          SITE_NAME: webflasher
        shell: bash
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/webflasher-release/webflasher-site.tar.gz"
          remote_stage="${DEPLOY_ROOT}/.${SITE_NAME}-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_target="${WEB_ROOT%/}"
          remote_backup="${DEPLOY_ROOT}/.${SITE_NAME}-previous"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          case "${remote_stage}" in
            /root/share/.webflasher-deploy-*) ;;
            *)
              echo "Refusing unexpected staging path: ${remote_stage}" >&2
              exit 1
              ;;
          esac

          cleanup() {
            ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- "${remote_stage}" <<'CLEANUP_SCRIPT' || true
          set -eu
          stage="$1"
          case "${stage}" in
            /root/share/.webflasher-deploy-*) ;;
            *) exit 1 ;;
          esac
          if [ -e "${stage}" ]; then
            rm -rf -- "${stage}"
          fi
          CLEANUP_SCRIPT
          }
          trap cleanup EXIT

          ssh -G "${SSH_TARGET}" >/dev/null
          ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
            "${DEPLOY_ROOT}" "${WEB_ROOT}" "${FIRMWARE_ROOT}" <<'PREFLIGHT_SCRIPT'
          set -eu
          deploy_root="$1"
          web_root="$2"
          firmware_root="$3"
          [ "${deploy_root}" = /root/share ]
          [ "${web_root}" = /root/share/webflasher/ ]
          [ "${web_root%/}" = "${deploy_root}/webflasher" ]
          [ "${firmware_root}" = /root/share/sybilsight/firmware-updates/source-files ]
          [ -d "${deploy_root}" ]
          [ -w "${deploy_root}" ]
          [ -d "${firmware_root}" ]
          [ -w "${firmware_root}" ]
          for required_command in tar stat chown chmod find mkdir mv cp cmp sed; do
            command -v "${required_command}" >/dev/null
          done
          PREFLIGHT_SCRIPT

          ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- "${remote_stage}" <<'STAGE_SCRIPT'
          set -eu
          stage="$1"
          case "${stage}" in
            /root/share/.webflasher-deploy-*) ;;
            *) exit 1 ;;
          esac
          if [ -e "${stage}" ]; then
            rm -rf -- "${stage}"
          fi
          mkdir -p "${stage}"
          STAGE_SCRIPT

          gzip -dc "${archive}" |
            ssh "${ssh_options[@]}" "${SSH_TARGET}" \
              tar -xpf - -C "${remote_stage}"

          ssh "${ssh_options[@]}" "${SSH_TARGET}" sh -s -- \
            "${remote_stage}" "${remote_target}" "${remote_backup}" \
            "${FIRMWARE_ROOT}" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'PUBLISH_SCRIPT'
          set -eu
          stage="$1"
          target="$2"
          backup="$3"
          firmware_root="$4"
          publish_id="$5"

          case "${stage}" in
            /root/share/.webflasher-deploy-*) ;;
            *) exit 1 ;;
          esac
          [ "${target}" = /root/share/webflasher ]
          [ "${backup}" = /root/share/.webflasher-previous ]
          [ "${firmware_root}" = /root/share/sybilsight/firmware-updates/source-files ]
          [ -s "${stage}/index.html" ]
          firmware_source="${stage}/firmware-updates/source-files"
          [ -s "${firmware_source}/index.json" ]
          [ ! -L "${target}" ]

          owner_group="0:0"
          if [ -d "${target}" ]; then
            owner_group="$(stat -c '%u:%g' "${target}")"
          fi
          chown -R "${owner_group}" "${stage}"
          chmod -R g+rwX "${stage}"
          find "${stage}" -type d -exec chmod g+s {} +

          firmware_owner_group="$(stat -c '%u:%g' "${firmware_root}")"
          catalog_incoming="${firmware_root}/.index.deploy-${publish_id}"
          rm -f -- "${catalog_incoming}"
          cp -p "${firmware_source}/index.json" "${catalog_incoming}"
          chown "${firmware_owner_group}" "${catalog_incoming}"
          chmod g+rw "${catalog_incoming}"

          # Versioned firmware package bytes are immutable. G2 releases live
          # at 2.*, while R1 Secure DFU releases live at r1/2.*. Publish
          # missing leaf directories before the index, but refuse every other
          # layout and every package collision. Existing archive directories
          # may safely coexist with newly extracted release-bound files;
          # generated metadata, checksums, and normalized manifests live
          # under /share/webflasher and do not define package identity here.
          publish_firmware_directory() {
            firmware_source_dir="$1"
            firmware_relative="$2"
            firmware_key="$3"

            case "${firmware_relative}" in
              2.*)
                firmware_parent="${firmware_root}"
                ;;
              r1/2.*)
                firmware_parent="${firmware_root}/r1"
                ;;
              *)
                echo "Refusing unexpected firmware path: ${firmware_relative}" >&2
                exit 1
                ;;
            esac

            if [ -e "${firmware_parent}" ]; then
              if [ ! -d "${firmware_parent}" ] || [ -L "${firmware_parent}" ]; then
                echo "Refusing non-directory firmware parent: ${firmware_parent}" >&2
                exit 1
              fi
            else
              mkdir "${firmware_parent}"
              chown "${firmware_owner_group}" "${firmware_parent}"
              chmod g+rwX,g+s "${firmware_parent}"
            fi

            firmware_incoming="${firmware_root}/.${firmware_key}.deploy-${publish_id}"
            firmware_target="${firmware_root}/${firmware_relative}"
            if [ -e "${firmware_target}" ]; then
              if [ ! -d "${firmware_target}" ] || [ -L "${firmware_target}" ]; then
                echo "Refusing non-directory firmware target: ${firmware_target}" >&2
                exit 1
              fi
              firmware_package="$(sed -n \
                's/^[[:space:]]*"sourceFile":[[:space:]]*"\([^"]*\)",*[[:space:]]*$/\1/p' \
                "${firmware_source_dir}/metadata.json")"
              case "${firmware_package}" in
                ""|*/*|.|..)
                  echo "Refusing invalid firmware package name: ${firmware_relative}" >&2
                  exit 1
                  ;;
              esac
              firmware_source_package="${firmware_source_dir}/${firmware_package}"
              firmware_target_package="${firmware_target}/${firmware_package}"
              if [ ! -f "${firmware_source_package}" ] || \
                [ -L "${firmware_source_package}" ] || \
                [ ! -f "${firmware_target_package}" ] || \
                [ -L "${firmware_target_package}" ] || \
                ! cmp -s "${firmware_source_package}" "${firmware_target_package}"; then
                echo "Refusing conflicting immutable firmware package: ${firmware_relative}/${firmware_package}" >&2
                exit 1
              fi

              # Preserve every byte already in the historical archive. If a
              # newly bundled file already exists there it must still match,
              # except for generated inventory/provenance documents whose
              # release-bound copies are served from the atomic website root.
              find "${firmware_source_dir}" -type f | while IFS= read -r firmware_source_file; do
                firmware_file="${firmware_source_file#"${firmware_source_dir}/"}"
                case "${firmware_file}" in
                  metadata.json|SHA256SUMS|manifest.json) continue ;;
                esac
                firmware_target_file="${firmware_target}/${firmware_file}"
                if [ -e "${firmware_target_file}" ] || [ -L "${firmware_target_file}" ]; then
                  if [ ! -f "${firmware_target_file}" ] || \
                    [ -L "${firmware_target_file}" ] || \
                    ! cmp -s "${firmware_source_file}" "${firmware_target_file}"; then
                    echo "Refusing conflicting immutable firmware file: ${firmware_relative}/${firmware_file}" >&2
                    exit 1
                  fi
                fi
              done
              return
            fi
            rm -rf -- "${firmware_incoming}"
            cp -a "${firmware_source_dir}" "${firmware_incoming}"
            chown -R "${firmware_owner_group}" "${firmware_incoming}"
            chmod -R g+rwX "${firmware_incoming}"
            find "${firmware_incoming}" -type d -exec chmod g+s {} +
            if ! mv "${firmware_incoming}" "${firmware_target}"; then
              exit 1
            fi
          }

          for firmware_source_entry in "${firmware_source}"/*; do
            [ -e "${firmware_source_entry}" ] || continue
            firmware_name="${firmware_source_entry##*/}"
            case "${firmware_name}" in
              index.json)
                if [ ! -f "${firmware_source_entry}" ] || [ -L "${firmware_source_entry}" ]; then
                  echo "Refusing invalid firmware catalog source" >&2
                  exit 1
                fi
                ;;
              2.*)
                if [ ! -d "${firmware_source_entry}" ] || [ -L "${firmware_source_entry}" ]; then
                  echo "Refusing non-directory firmware source: ${firmware_name}" >&2
                  exit 1
                fi
                publish_firmware_directory \
                  "${firmware_source_entry}" "${firmware_name}" "${firmware_name}"
                ;;
              r1)
                if [ ! -d "${firmware_source_entry}" ] || [ -L "${firmware_source_entry}" ]; then
                  echo "Refusing non-directory R1 firmware source" >&2
                  exit 1
                fi
                ring_release_count=0
                for ring_source_dir in "${firmware_source_entry}"/*; do
                  [ -e "${ring_source_dir}" ] || continue
                  ring_name="${ring_source_dir##*/}"
                  case "${ring_name}" in
                    2.*) ;;
                    *)
                      echo "Refusing unexpected R1 firmware directory: ${ring_name}" >&2
                      exit 1
                      ;;
                  esac
                  if [ ! -d "${ring_source_dir}" ] || [ -L "${ring_source_dir}" ]; then
                    echo "Refusing non-directory R1 firmware source: ${ring_name}" >&2
                    exit 1
                  fi
                  publish_firmware_directory \
                    "${ring_source_dir}" "r1/${ring_name}" "r1-${ring_name}"
                  ring_release_count=$((ring_release_count + 1))
                done
                if [ "${ring_release_count}" -eq 0 ]; then
                  echo "Refusing empty R1 firmware directory" >&2
                  exit 1
                fi
                ;;
              *)
                echo "Refusing unexpected firmware directory: ${firmware_name}" >&2
                exit 1
                ;;
            esac
          done

          if [ -e "${backup}" ]; then
            rm -rf -- "${backup}"
          fi

          moved_previous=false
          if [ -e "${target}" ]; then
            mv "${target}" "${backup}"
            moved_previous=true
          fi

          if ! mv "${stage}" "${target}"; then
            if [ "${moved_previous}" = true ]; then
              mv "${backup}" "${target}"
            fi
            exit 1
          fi

          # Publish the catalog last. A new app observed during this narrow
          # boundary sees a digest mismatch and refuses mutation; old apps
          # continue to see their old catalog until this atomic rename.
          if ! mv "${catalog_incoming}" "${firmware_root}/index.json"; then
            failed_target="${stage}.failed-publish"
            mv "${target}" "${failed_target}" || true
            if [ "${moved_previous}" = true ]; then
              mv "${backup}" "${target}"
            fi
            exit 1
          fi
          PUBLISH_SCRIPT

          trap - EXIT
          echo "Deployed ${GITHUB_SHA} to ${SSH_TARGET}:${remote_target}"

      - name: Verify production release identity
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://webflasher.sybilsight.com/remote-support/healthz"
          observed_health_file="${RUNNER_TEMP}/observed-remote-support-health.json"
          health_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --output "${observed_health_file}" \
              "${health_url}" && node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const expected = [
                  "automatic_usb_recovery",
                  "automatic_apply",
                  "bluetooth_probe",
                  "bluetooth_recovery",
                ];
                if (health.ok !== true || health.protocol !== 3) process.exit(1);
                if (!expected.every((task) => health.tasks?.includes(task))) process.exit(1);
              ' "${observed_health_file}"; then
              health_ready=true
              break
            fi
            sleep 2
          done
          if [ "${health_ready}" != true ]; then
            echo "Production Remote Support relay did not advertise protocol 3 and its fixed task list." >&2
            cat "${observed_health_file}" >&2 || true
            exit 1
          fi
          release_url="https://webflasher.sybilsight.com/release.json?verify=${GITHUB_SHA}&run=${GITHUB_RUN_ID}"
          observed_release_file="${RUNNER_TEMP}/observed-release.json"
          observed_catalog_file="${RUNNER_TEMP}/observed-firmware-catalog.json"
          observed_archive_catalog_file="${RUNNER_TEMP}/observed-archive-catalog.json"
          observed_target_file="${RUNNER_TEMP}/observed-reviewed-custom.bin"
          curl --fail --silent --show-error \
            --header 'Cache-Control: no-cache' \
            --output "${observed_release_file}" \
            "${release_url}"
          catalog_url="https://webflasher.sybilsight.com/firmware-catalog.json?verify=${GITHUB_SHA}&run=${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --header 'Cache-Control: no-cache' \
            --output "${observed_catalog_file}" \
            "${catalog_url}"
          archive_catalog_url="https://webflasher.sybilsight.com/firmware-updates/source-files/index.json?verify=${GITHUB_SHA}&run=${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --header 'Cache-Control: no-cache' \
            --output "${observed_archive_catalog_file}" \
            "${archive_catalog_url}"
          if ! cmp --silent "${observed_catalog_file}" "${observed_archive_catalog_file}"; then
            echo "Production source-files catalog does not match the release-bound catalog" >&2
            exit 1
          fi
          target_metadata="$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const [releasePath, catalogPath, expectedBuild] = process.argv.slice(1);
            const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
            if (release.schemaVersion !== 1 || release.buildSha !== expectedBuild) {
              throw new Error("Production release identity does not match " + expectedBuild);
            }
            const catalogBytes = fs.readFileSync(catalogPath);
            const catalogSha256 = crypto.createHash("sha256").update(catalogBytes).digest("hex");
            if (catalogSha256 !== release.firmwareCatalogSha256) {
              throw new Error("Production firmware catalog does not match release.json");
            }
            const catalog = JSON.parse(catalogBytes);
            const customReleases = catalog.releases.filter((entry) => entry.channel === "custom");
            if (customReleases.length !== 0) {
              throw new Error("Production catalog still contains a retired custom firmware release");
            }
            const target = catalog.releases
              .filter((entry) => entry.channel === "official" && entry.trust === "official-pinned")
              .sort((left, right) => right.internalVersion.localeCompare(left.internalVersion, undefined, { numeric: true }))[0];
            if (!target?.url || !/^[0-9a-f]{64}$/.test(target.sha256 ?? "")) {
              throw new Error("Production catalog has no newest official target");
            }
            process.stdout.write(target.url + " " + target.sha256);
          ' "${observed_release_file}" "${observed_catalog_file}" "${GITHUB_SHA}")"
          read -r target_url target_sha256 <<<"${target_metadata}"
          curl --fail --silent --show-error \
            --output "${observed_target_file}" \
            "https://webflasher.sybilsight.com${target_url}?verify=${GITHUB_SHA}&run=${GITHUB_RUN_ID}"
          observed_target_sha256="$(sha256sum "${observed_target_file}" | cut -d ' ' -f 1)"
          if [ "${observed_target_sha256}" != "${target_sha256}" ]; then
            echo "Production official target ${observed_target_sha256} does not match ${target_sha256}" >&2
            exit 1
          fi
          echo "Verified production WebFlasher ${GITHUB_SHA}, catalog, and ${target_url}"
